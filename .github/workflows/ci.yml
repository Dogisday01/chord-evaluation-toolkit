name: Validate build and deliver

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-build-isolation
          python -m pip check
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Independent known answers and negative tests
        run: python -m pytest --junitxml=reports/test-results.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: reports/test-results.xml

  distribution:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install -r requirements-dev.txt
          python -m build --no-isolation
      - name: Verify wheel outside the source checkout
        run: python scripts/verify_distribution.py --evidence reports/distribution-check.json
      - name: Deliver distributions and their verification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chord-evaluation-distribution
          path: |
            dist/*
            reports/distribution-check.json
          if-no-files-found: error
          retention-days: 30
